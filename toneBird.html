<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
        }

        #gameCanvas {
            display: block;
            background: #70c5ce;
        }

        body { font: 14pt 'Alike', sans-serif; }
        #note { font-size: 164px; }
        .droptarget { background-color: #348781}
        div.confident { color: black; }
        div.vague { color: lightgrey; display: none; }
        #note { display: inline-block; height:180px; text-align: left; }
        #detector { width: 300px; height: 300px; border: 4px solid gray; border-radius: 8px; text-align: center; padding-top: 10px; }
        #output { width: 300px; height:42px; }
        #flat { display: none; }
        #sharp { display: none; }
        .flat #flat { display: inline; }
        .sharp #sharp { display: inline; }

        /* Menu Styling */
        #menu {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="menu">
        <p><button onclick="startGame(); closeMenu()">Start Game</button></p>
        <p><button onclick="useDemoAudio(); closeMenu();  rafID = requestAnimationFrame(gameLoop);">Use Demo Audio</button></p>
        <p><button onclick="closeMenu();  rafID = requestAnimationFrame(gameLoop);">Close Menu</button></p>
    </div>



    <script src="js/pitchdetect.js"></script>
    <script src="js/toneBird.js"></script>

    <script>

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                if (!paused) {
                    openMenu();
                } else {
                    closeMenu();
                    rafID = requestAnimationFrame(gameLoop);
                }
            }
        });

        function openMenu() {
            document.getElementById('menu').style.display = 'block';
            paused = true;
        }

        function closeMenu() {
            document.getElementById('menu').style.display = 'none';
            paused = false;
        }
    </script>

    <div id="detector" class="vague" style="display: none !important;">
        <div class="pitch"><span id="pitch">--</span>Hz</div>
        <div class="note"><span id="note">--</span></div>
        <canvas id="output" width=300 height=42></canvas>
        <div id="detune"><span id="detune_amt">--</span><span id="flat">cents &#9837;</span><span id="sharp">cents &#9839;</span></div>
    </div>
</body>
</html>
