<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tone Bird</title>
    <style>
        html,body{
            height: 100%
        }

        body {
            margin: 0;
        }

        #gameCanvas {
            display: block;
            background: #70c5ce;
        }

        body { font: 14pt 'Alike', sans-serif; }
        #note { font-size: 164px; }
        .droptarget { background-color: #348781}
        div.confident { color: black; }
        div.vague { color: lightgrey; display: none; }
        #note { display: inline-block; height:180px; text-align: left; }
        #detector { width: 300px; height: 300px; border: 4px solid gray; border-radius: 8px; text-align: center; padding-top: 10px; }
        #output { width: 300px; height:42px; }
        #flat { display: none; }
        #sharp { display: none; }
        .flat #flat { display: inline; }
        .sharp #sharp { display: inline; }

        /* Menu Styling */
        #menu {
            display: visible;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 200px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .custom-button{
            border: 1px solid black;
            background: #fff;
            color: black;
            padding: 10px;
            width: 130px;
            display: inline-block;
            font-size: 13px;
            border-radius: 10px;
        }

        .custom-button:hover{
            border: 1px solid black;
            background: #ffffff8c;
            color: black;

            border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div><button onclick="buttonEvent()">Open menu</button></div>

    <div id="menu">
        <p><button onclick="startGame(false); closeMenu()" class="custom-button">Začni igro (z ovirami)</button></p>
        <p><button onclick="startGame(true); closeMenu()" class="custom-button">Začni igro (brez ovir)</button></p>
        <p><button onclick=" useDemoAudio(); closeMenuWithAnimation();" class="custom-button">Predvajaj zvok</button></p>
        <div style="border: 1px solid white ">
            <p><input type="file" id="audioUpload" accept="audio/*" style="display: none;"><label for="audioUpload" id="predvajanjo"  class="custom-button">Izberi datoteko</label></p>
            <p><button onclick="uploadAudioFile()"  class="custom-button">Naloži datoteko</button></p>
        </div>
        <p><button onclick="closeMenuWithAnimation();"  class="custom-button">Zapri meni</button></p>
    </div>



    <script src="js/pitchdetect.js"></script>
    <script src="js/toneBird.js"></script>

    <script>
        let uploadedAudioURL = null;

        function buttonEvent(){
            if (!paused) {
                    openMenu();
                    if(isPlaying){
                        sourceNode.stop(0)
                        pausedAt = Date.now() - startedAt;
                        pausedSound = true;
                    }
                } else {
                    closeMenu();
                    
                    if(isPlaying){
                        togglePlayback()
                    }
                    if(gameStart){
                        rafID = requestAnimationFrame(gameLoop);
                    }
                }
        }

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                if (!paused) {
                    openMenu();
                    if(isPlaying){
                        sourceNode.stop(0)
                        pausedAt = Date.now() - startedAt;
                        pausedSound = true;
                    }
                } else {
                    closeMenu();

                    if(isPlaying){
                        togglePlayback()
                    }
                    if(gameStart){
                        rafID = requestAnimationFrame(gameLoop);
                    }
                }
            }
        });

        function openMenu() {
            document.getElementById('menu').style.display = 'block';
            paused = true;
        }

        function closeMenu() {
            document.getElementById('menu').style.display = 'none';
            paused = false;
        }

        function closeMenuWithAnimation() {
            document.getElementById('menu').style.display = 'none';
            paused = false;
            rafID = requestAnimationFrame(gameLoop);
        }

        async function uploadAudioFile() {
            const audioInput = document.getElementById('audioUpload');
            const file = audioInput.files[0];
            
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(event) {
                const audioData = event.target.result;
                try {
                    theBuffer = await audioContext.decodeAudioData(audioData);
                    
                    let el = document.getElementById("predvajanjo")
                    el.innerText = "Izbrana: "+file.name
                    //alert("Audio file uploaded and ready for playback!");
                } catch (error) {
                    alert("Error decoding audio file.");
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }
        uploadAudioFile()
    </script>

    <div id="detector" class="vague" style="display: none !important;">
        <div class="pitch"><span id="pitch">--</span>Hz</div>
        <div class="note"><span id="note">--</span></div>
        <canvas id="output" width=300 height=42></canvas>
        <div id="detune"><span id="detune_amt">--</span><span id="flat">cents &#9837;</span><span id="sharp">cents &#9839;</span></div>
    </div>
</body>
</html>
